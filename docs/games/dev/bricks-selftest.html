<!-- HGames нема — модуль виставить лише рушій (window.BricksCore) і тихо вийде -->
<script src="../../../web/games/bricks.js"></script>
<script>
  function runAll() {
    const B = window.BricksCore;
    const fx = JSON.parse(document.getElementById('bricks-fx').textContent);
    const res = [];
    // xorshift від 1 і хеш порожньої стіни з T на появі
    let x = 1;
    const xs = [];
    for (let i = 0; i < 8; i++) { x = B.nextRand(x); xs.push(x); }
    res.push({ name: 'xorshift', got: xs.join(','), want: fx.xorshift.join(','), ok: xs.join(',') === fx.xorshift.join(',') });
    const c = new B.Core();
    c.reset(1, 0, 1800);
    c.spawn(2);
    res.push({ name: 'spawnT', got: c.hash(), want: fx.spawnT, ok: c.hash() === fx.spawnT });
    for (const f of fx.fixtures) {
      const r = B.run(f);
      res.push({ name: f.name, got: r.hash, want: f.hash, lines: r.lines, ok: r.hash === f.hash && r.lines === f.lines });
    }
    const s = B.suite();
    res.push({ name: 'suite', got: s, want: fx.suite, ok: s === fx.suite });

    // Швидкодія рушія в браузері: крок стіни й відкат на 60 подій (spec §8.5: ≤ 20 мкс і ≤ 2 мс).
    const w = new B.Core();
    w.reset(3, 0, 60);
    const keys = [1, 2, 3, 4, 7, 8, 5, 6, 10, 11, 0];
    let t0 = performance.now(), n = 0;
    for (let i = 0; i < 200000; i++) {
      if (!w.alive) w.reset(i + 3, 0, 60);
      if (i % 7 === 0) w.apply(keys[(i / 7 | 0) % keys.length]);
      w.step();
      w.clearN = 0;
      n++;
    }
    const stepUs = (performance.now() - t0) * 1000 / n;
    const base = new B.Core();
    base.reset(9, 0, 600);
    const snap = new B.Core().copyFrom(base);
    const ev = B.gen(9, 60);
    t0 = performance.now();
    const R = 200;
    for (let rep = 0; rep < R; rep++) {
      base.copyFrom(snap);
      for (let i = 0; i < ev.length; i += 2) { base.advanceTo(ev[i]); base.apply(ev[i + 1]); }
    }
    const rollbackMs = (performance.now() - t0) / R;

    const bad = res.filter((r) => !r.ok);
    const sum = bad.length ? 'FAIL ' + bad.length + ' з ' + res.length : 'OK ' + res.length + '/' + res.length;
    document.title = sum;
    document.getElementById('sum').textContent = sum + ' · крок ' + stepUs.toFixed(2) + ' мкс · відкат 60 подій ' + rollbackMs.toFixed(3) + ' мс';
    document.getElementById('out').innerHTML = res.map((r) => '<span class="' + (r.ok ? 'p' : 'f') + '">' + (r.ok ? '✓ ' : '✗ ') + r.name
      + '</span> <span class="m">' + r.got + (r.ok ? '' : ' ≠ ' + r.want) + (r.lines != null ? ' · рядів ' + r.lines : '') + '</span>').join('\n');
    return { ok: !bad.length, total: res.length, failed: bad.map((r) => r.name), stepUs: +stepUs.toFixed(3), rollbackMs: +rollbackMs.toFixed(3), results: res };
  }
  window.addEventListener('load', () => { try { runAll(); } catch (e) { document.getElementById('sum').textContent = 'ВПАЛО: ' + e; throw e; } });
</script>
