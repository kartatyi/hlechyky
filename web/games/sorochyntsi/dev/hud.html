<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Сорочинський ярмарок — стенд картки</title>
<link rel="stylesheet" href="/static/style.css">
<link rel="stylesheet" href="/games/core.css">
<link rel="stylesheet" href="/games/sorochyntsi.css">
<style>
  /* Стенд, не прод: картка гри без сервера на підробних видах (dev/fixture.js). Звук — лише якщо сам увімкнеш 🔇→🔊. */
  body { padding: 0; margin: 0; background: var(--bg); }
  .hbar { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; padding: 8px 12px; background: var(--panel); border-bottom: 1px solid var(--line);
    position: sticky; top: 0; z-index: 20; font-size: 14px; }
  .hbar select, .hbar button { font: inherit; padding: 4px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel2); color: var(--text); }
  .hwrap { margin: 12px auto; padding: 12px; background: var(--panel); border-radius: 14px; box-sizing: border-box; }
  .hwrap.phone { width: 375px; max-width: 100%; padding: 8px; }
  .hwrap.laptop { width: min(1100px, 100%); }
  #hstatus { font-weight: 700; color: var(--accent); }
  #hlog { margin: 0 auto 30px; width: min(1100px, 100%); font: 12px/1.4 ui-monospace, monospace; color: var(--muted); white-space: pre-wrap; padding: 0 12px; box-sizing: border-box; }
  body.shot .hbar, body.shot #hlog { display: none; }
  body.shot .hwrap { margin: 0 auto; border-radius: 0; }
</style>
</head>
<body>
<div class="hbar" data-pad-skip>
  <b>Сорочинці · стенд картки</b>
  <label>сценарій <select id="hsc"></select></label>
  <label>хто дивиться <select id="hseat"><option value="0">місце 0</option><option value="1">місце 1</option><option value="2">місце 2</option><option value="3">місце 3</option><option value="">глядач</option></select></label>
  <label>ширина <select id="hw"><option value="laptop">ноутбук</option><option value="phone">телефон 375</option></select></label>
  <label>поле <select id="hview"><option value="2d">🗺 2D</option><option value="3d">🧊 3D</option></select></label>
  <button data-ev="take">чужий take</button>
  <button data-ev="take2">take 2</button>
  <button data-ev="reserve">бронь з ряду</button>
  <button data-ev="blind">бронь наосліп</button>
  <button data-ev="buy">купівля + поповнення</button>
  <button data-ev="discard">повернення</button>
  <button data-ev="guest">гість</button>
  <button data-ev="starshyna">старшина</button>
  <button data-ev="bulava">булава</button>
  <button data-ev="turn">мій хід</button>
  <button id="hlate">час минув</button>
  <button id="hbot">бот думає</button>
  <span>статус: <span id="hstatus"></span></span>
</div>
<div id="hwrap" class="hwrap laptop"><div id="hroot"></div></div>
<pre id="hlog" data-pad-skip></pre>

<script>
  // Мінімальний підробний каркас: лише те, чим користується sorochyntsi.js.
  window.__acts = [];
  window.__sends = [];
  const hlog = (s) => { const el = document.getElementById('hlog'); el.textContent = s + '\n' + el.textContent.slice(0, 4000); };
  window.HGames = {
    mods: {},
    register(m) { this.mods[m.id] = m; },
    send(method, room, action, payload) { window.__sends.push({ method, room, action, payload }); hlog('send ' + method + ' ' + action + ' ' + JSON.stringify(payload)); return Promise.resolve({ ok: true }); },
    ui: { coarse: () => matchMedia('(pointer: coarse)').matches, human: (e) => e.isTrusted },
  };
</script>
<script src="/games/sorochyntsi.js"></script>
<script type="module">
  import { makeView, makeEvent, SCENARIOS } from '/games/sorochyntsi/dev/fixture.js';
  const $ = (id) => document.getElementById(id);
  const root = $('hroot');
  const mod = HGames.mods.sorochyntsi;
  const q = new URLSearchParams(location.search);
  const S = { sc: q.get('sc') || 'mid', seat: q.has('seat') ? q.get('seat') : '0', w: q.get('w') || 'laptop', view: q.get('view') || '2d', v: null, mounted: false };
  if (q.has('shot')) document.body.classList.add('shot');
  for (const s of SCENARIOS) $('hsc').insertAdjacentHTML('beforeend', '<option>' + s + '</option>');

  function ctxOf(v) {
    const seat = v.me ? v.me.seat : null;
    return {
      room: { id: 'sor-dev', status: v.phase == null ? 'lobby' : v.phase === 'over' ? 'done' : 'playing', options: { bots: '0' } },
      seat, view: v, me: { nick: 'Smaug' }, playing: v.phase != null && v.phase !== 'over', mine: seat !== null, myTurn: seat !== null && v.turn === seat,
      act(a, p) { window.__acts.push({ a, p }); hlog('act ' + a + ' ' + JSON.stringify(p)); return Promise.resolve({ ok: true }); },
      toast: (s) => hlog('toast ' + s), esc: (s) => String(s), seatName: (i) => 'місце ' + i,
      nickOf: (i) => ((v.players || []).find((p) => p.seat === i && !p.bot) || {}).nick || null, css: () => '', ui: HGames.ui,
    };
  }
  function push() {
    const c = ctxOf(S.v);
    if (!S.mounted) { mod.mount(root, c); S.mounted = true; } else mod.update(root, c);
    setTimeout(() => { $('hstatus').textContent = mod.status(c); }, 60);
  }
  function load() {
    try { localStorage.setItem('sor.view', S.view); localStorage.setItem('sor.sound', '0'); } catch (e) {}
    if (S.mounted) { mod.unmount(root); root.innerHTML = ''; S.mounted = false; }
    const seat = S.seat === '' ? null : +S.seat;
    S.v = makeView(S.sc, seat);
    $('hwrap').className = 'hwrap ' + S.w;
    $('hsc').value = S.sc; $('hseat').value = S.seat; $('hw').value = S.w; $('hview').value = S.view;
    push();
    window.ready = true;
  }
  function addEv(list, patch) {
    let seq = S.v.seq;
    const evs = list.map(([k, o]) => makeEvent(k, { ...o, seq: ++seq }));
    S.v = { ...S.v, ...(patch || {}), seq, events: [...(S.v.events || []), ...evs].slice(-40) };
    push();
  }
  function fire(k) {
    const v = S.v, other = (v.order || []).find((s) => !v.me || s !== v.me.seat) ?? 1;
    const row = (t, i) => (v.rows[t - 1] || [])[i];
    if (k === 'take') addEv([['take', { seat: other, got: { fish: 1, herbs: 1, clay: 1 } }], ['turn', { seat: other }]]);
    if (k === 'take2') addEv([['take', { seat: other, got: { clay: 2 } }]]);
    if (k === 'reserve') addEv([['reserve', { seat: other, tier: 2, slot: 1, card: row(2, 1), gold: 1 }], ['refill', { tier: 2, slot: 1, card: 53 }]]);
    if (k === 'blind') addEv([['reserve', { seat: other, tier: 3, slot: null, card: null, gold: 1 }]]);
    if (k === 'buy') addEv([['buy', { seat: other, card: row(1, 3), from: 'row', slot: 3, pay: { linen: 1 }, bonus: 'wool', pts: 0 }], ['refill', { tier: 1, slot: 3, card: 39 }]]);
    if (k === 'discard') addEv([['discard', { seat: other, gave: { fish: 1, gold: 1 } }]]);
    if (k === 'guest') addEv([['guest', { seat: other, guest: (v.guests[0] || {}).id ?? 0 }]]);
    if (k === 'starshyna') addEv([['starshyna', { seat: other, from: v.starshyna ? v.starshyna.seat : null, icons: 4 }]]);
    if (k === 'bulava') addEv([['bulava', { seat: other }], ['last', { reason: 'bulava' }]]);
    if (k === 'turn') addEv([['turn', { seat: v.me ? v.me.seat : 0 }]]);
  }
  window.__load = (sc, seat = '0', w = 'laptop', view = '2d') => { Object.assign(S, { sc, seat: String(seat ?? ''), w, view }); load(); };
  window.__view = () => S.v;
  window.__push = (patch) => { if (patch) S.v = { ...S.v, ...patch }; push(); };
  window.__fire = fire;
  window.__mod = mod;
  $('hsc').onchange = (e) => { S.sc = e.target.value; load(); };
  $('hseat').onchange = (e) => { S.seat = e.target.value; load(); };
  $('hw').onchange = (e) => { S.w = e.target.value; load(); };
  $('hview').onchange = (e) => { S.view = e.target.value; load(); };
  for (const b of document.querySelectorAll('[data-ev]')) b.onclick = () => fire(b.dataset.ev);
  $('hlate').onclick = () => { S.v = { ...S.v, deadline: new Date(Date.now() - 1000).toISOString() }; push(); };
  $('hbot').onclick = () => { S.v = { ...S.v, botIn: 300 }; push(); };
  load();
</script>
</body>
</html>
